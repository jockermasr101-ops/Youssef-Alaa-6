<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>404 – الصفحة غير موجودة</title>
<link rel="icon" href="/logo.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap">
<style>
:root{--bg:#f3f7fc;--ink:#10223a;--muted:#5a6b82;--brand:#0a7cff;--soft:#e2efff}
@media(prefers-color-scheme:dark){:root{--bg:#0c1524;--ink:#e9f0fb;--muted:#9db0c9;--brand:#3d95ff;--soft:#182b4a}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,sans-serif;line-height:1.8;padding:16px}
.box{max-width:520px;text-align:center;background:var(--soft);border-radius:28px;padding:40px 24px}
.box img{width:96px;height:96px;border-radius:22px}.n{font-size:84px;font-weight:800;color:var(--brand);line-height:1;margin:12px 0}
h1{margin:0 0 8px;font-size:26px}p{color:var(--muted);margin:0 0 22px}
a{display:inline-block;background:var(--brand);color:#fff;padding:12px 30px;border-radius:999px;font-weight:700;text-decoration:none}
</style>
</head>
<body><div class="box"><img src="/logo.jpg" alt=""><div class="n">404</div><h1>الصفحة دي مش موجودة</h1><p>يمكن الرابط غلط أو الصفحة اتنقلت. ارجع للرئيسية وكمّل من هناك.</p><a href="/">الرجوع للرئيسية</a></div></body>
</html>
