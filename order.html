<title>يوسف علاء – تصميم إعلاني</title><meta name="description" content="يوسف علاء، مصمم جرافيك: إعلانات سوشيال ميديا وبنرات وهويات بصرية تزيد مبيعاتك."><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0b0b0d"><meta property="og:type" content="website"><meta property="og:locale" content="ar_EG"><meta property="og:title" content="يوسف علاء – مصمم جرافيك"><meta property="og:description" content="إعلانات وبنرات وهويات بصرية تزيد مبيعاتك.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f4f6;--surface:#fff;--ink:#0c0c0f;--muted:#5d6068;--line:#dcdde2;--brand:#111114;--on-brand:#fff;--soft:#e9eaee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#09090b;--surface:#141418;--ink:#eef0f3;--muted:#9a9ea8;--line:#26272d;--brand:#e4e6ea;--on-brand:#0b0b0d;--soft:#1c1d22}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#09090b;--surface:#141418;--ink:#eef0f3;--muted:#9a9ea8;--line:#26272d;--brand:#e4e6ea;--on-brand:#0b0b0d;--soft:#1c1d22}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,Arial,sans-serif;font-size:17px;line-height:1.8}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
.wrap{max-width:1060px;margin:0 auto;padding:0 16px}
.bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:20;margin-top:10px}
.pill{background:#0b0b0d;color:#eceef2;border:1px solid #2c2e35;border-radius:999px;height:66px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.icon{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.22);color:inherit;font-size:20px}
.logo{font-weight:800;font-size:21px}
.menu{display:none;margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px}
.menu.open{display:block}
.menu a{display:block;text-align:center;padding:12px;border-radius:12px;font-weight:500}
.menu a:hover,.menu a.on{background:var(--soft)}
.menu .cta{background:var(--brand);color:var(--on-brand);margin-top:6px}
.view{display:none;padding-bottom:90px}
.view.on{display:block}
h1{font-size:clamp(32px,6.5vw,56px);line-height:1.3;margin:0 0 14px;font-weight:800}
h2{font-size:26px;margin:0 0 6px}
.hero{padding:48px 0 20px}
.hero p,.sub{color:var(--muted);max-width:50ch;margin:0 0 22px}
.hero p{font-size:19px}
.btn{display:inline-block;padding:12px 26px;border-radius:999px;background:var(--brand);color:var(--on-brand);font-weight:700;border:0;text-align:center}
.btn.alt{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.sec{padding:26px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.thumb{height:120px;display:grid;place-items:center;font-size:28px;font-weight:800;color:#fff}
.b{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.b h3{margin:0;font-size:19px}
.b p{margin:0;color:var(--muted);font-size:15px}
.tag{align-self:flex-start;font-size:13px;background:var(--soft);color:var(--brand);padding:1px 10px;border-radius:99px}
.case{font-size:14.5px;display:grid;gap:4px}
.case b{color:var(--brand)}
.meta{display:flex;justify-content:space-between;margin-top:auto;padding-top:10px;font-weight:700}
.card .btn{padding:9px;font-size:15px;margin-top:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 16px;border-radius:99px}
.chip.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
label{display:block;font-weight:500;margin:10px 0 4px}
input,textarea,select{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.msgs{height:250px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--bg);border-radius:12px;margin-bottom:10px}
.msg{max-width:82%;padding:8px 14px;border-radius:16px;font-size:15px}
.msg.me{align-self:flex-start;background:var(--brand);color:var(--on-brand)}
.msg.them{align-self:flex-end;background:var(--surface);border:1px solid var(--line)}
.send{display:flex;gap:8px}.send input{flex:1}.send .btn{padding:10px 20px}
.step{padding:6px 0;border-top:1px solid var(--line);color:var(--muted)}
.step.done{color:var(--brand);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;font-size:14px}
.stat b{font-size:26px;display:block;color:var(--brand)}
.st{padding:1px 10px;border-radius:99px;font-size:13px;background:var(--soft);color:var(--brand)}
.note{background:var(--soft);border-radius:12px;padding:10px 14px;font-size:14px;margin:12px 0}
.pane{display:none}
.fab{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:30;background:#0b0b0d;color:#eceef2;border:1px solid #3a3c44;border-radius:999px;padding:14px 22px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.sp{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);z-index:30;width:min(340px,calc(100vw - 32px));display:none;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.sp.open{display:block}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 90px);inset-inline:16px;margin:auto;max-width:360px;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;text-align:center;z-index:40;display:none}
footer{padding:24px 0 90px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
.card{border-radius:22px;box-shadow:0 10px 24px -18px rgba(16,34,58,.4)}.panel{border-radius:22px;padding:22px}.grid{gap:20px}.view{padding-bottom:110px}
.thumb{position:relative;overflow:hidden;isolation:isolate;height:150px;font-size:24px;background-image:linear-gradient(135deg,rgba(255,255,255,.2),rgba(0,0,0,.14))!important}
.thumb::before{content:"";position:absolute;z-index:-1;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.2);inset-inline-end:-24px;top:-34px}
.thumb::after{content:"";position:absolute;z-index:-1;width:90px;height:90px;border-radius:24px;background:rgba(255,255,255,.16);inset-inline-start:22px;bottom:-30px;transform:rotate(18deg)}
#home .hero{background:var(--soft);border-radius:28px;padding:44px 24px;margin-top:18px}
.hero h1{letter-spacing:-.5px}h2::before{content:"";display:inline-block;width:6px;height:22px;border-radius:4px;background:var(--brand);margin-inline-end:10px;vertical-align:-3px}
.stepn{color:var(--brand);font-size:26px;font-weight:800;line-height:1}
.gbtn{width:100%;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700}.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;margin:14px 0}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.thumb{background-color:#1b1c21;color:#eceef2}.hl{width:min(300px,72%);border-radius:24px;display:block;margin:0 0 22px}.tabs{position:fixed;inset-inline:0;bottom:0;z-index:25;display:flex;background:#0b0b0d;border-top:1px solid #2c2e35;padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 6px)}.tabs a{flex:1;text-align:center;color:#9a9ea8;font-size:13px;padding:6px 2px;border-radius:12px}.tabs a.on{color:#fff;background:#1b1c21}.back{background:none;border:0;color:var(--muted);padding:14px 0 0;font-weight:500}.wm{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:.18}.noselect{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.view img{-webkit-user-drag:none}@media print{body{display:none!important}}
.hero .tag{margin-bottom:12px}#quick{margin-top:22px}details summary{cursor:pointer;font-weight:700}
.menu a.so{display:none}body.staff .menu a.so{display:block}body.staff .co{display:none!important}
#clinks{flex-direction:column}#clinks a{width:100%;padding:16px;font-size:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
